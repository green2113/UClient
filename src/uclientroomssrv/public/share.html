<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UClient Share</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #12141c 0%, #08090d 100%); color: #eef0f6;
    }
    .card {
      width: min(420px, calc(100vw - 32px)); padding: 28px 26px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12); background: rgba(30,32,40,.92);
      box-shadow: 0 18px 48px rgba(0,0,0,.45);
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
    .kind { color: #9b8ef8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    p { color: #a8adb8; line-height: 1.55; font-size: 14px; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    button, a.btn {
      display: block; text-align: center; border: 0; border-radius: 10px; padding: 13px 16px;
      font: 650 14px/1 inherit; cursor: pointer; text-decoration: none;
    }
    .primary { background: #7c6cf0; color: #fff; }
    .primary:hover { filter: brightness(1.06); }
    .secondary { background: rgba(255,255,255,.08); color: #eef0f6; }
    .err { color: #ff8a80; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="kind" id="kind">Loading…</div>
    <h1 id="title">UClient Share</h1>
    <p id="desc">Fetching shared shortcut…</p>
    <div class="actions" id="actions" hidden>
      <a class="btn primary" id="open-uclient" href="#">Open in UClient</a>
    </div>
    <p class="err" id="err" hidden></p>
  </div>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var shareId = "";
      if (parts[0] === "shortcuts" && parts[1] === "share" && parts[2]) shareId = parts[2];
      else if (parts[0] === "share" && parts[1]) shareId = parts[1];
      else shareId = parts[parts.length - 1] || "";
      var deepLink = "uclient://share/" + shareId;
      var openLink = document.getElementById("open-uclient");
      openLink.href = deepLink;
      function tryAutoOpenUClientOnce() {
        try {
          var iframe = document.createElement("iframe");
          iframe.setAttribute("aria-hidden", "true");
          iframe.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden";
          iframe.src = deepLink;
          document.body.appendChild(iframe);
          setTimeout(function () { iframe.remove(); }, 3000);
        } catch (e) {}
        window.location.href = deepLink;
      }
      if (!/^[0-9a-f-]{36}$/i.test(shareId)) {
        document.getElementById("err").hidden = false;
        document.getElementById("err").textContent = "Invalid share link.";
        document.getElementById("kind").textContent = "Error";
        document.getElementById("title").textContent = "Not found";
        document.getElementById("desc").textContent = "";
        return;
      }
      document.getElementById("desc").textContent = "Opening UClient…";
      document.getElementById("actions").hidden = false;
      requestAnimationFrame(tryAutoOpenUClientOnce);
      fetch("/shortcuts/share/" + encodeURIComponent(shareId), {headers: {Accept: "application/json"}})
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error((res.j && res.j.message) || "Share not found.");
          var entry = res.j.entry || {};
          var kind = entry.kind === "automation" ? "Automation" : "Shortcut";
          document.getElementById("kind").textContent = kind;
          document.getElementById("title").textContent = entry.name || "Shared item";
          document.getElementById("desc").textContent =
            kind === "Automation"
              ? "If UClient did not open, tap the button below. Save in the editor to keep a copy on this PC."
              : "If UClient did not open, tap the button below. Save in the editor to keep a copy on this PC.";
        })
        .catch(function (e) {
          document.getElementById("err").hidden = false;
          document.getElementById("err").textContent = e.message || "Could not load share.";
          document.getElementById("kind").textContent = "Error";
          document.getElementById("title").textContent = "Unavailable";
          document.getElementById("desc").textContent = "";
        });
    })();
  </script>
</body>
</html>

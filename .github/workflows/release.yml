# .github/workflows/release.yml
name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.0.0). Did you remember to bump the version.h?'
        required: true
      release_name:
        description: 'Name of the release'
        required: true
      body:
        description: 'Release description'
        required: false
      run_id:
        description: 'Run ID of the build workflow to download artifacts from'
        required: true
      r2_bucket:
        description: 'Cloudflare R2 bucket name'
        required: false
        default: 'download'
      r2_public_base_url:
        description: 'Public base URL for R2 release artifacts (without trailing slash)'
        required: false
        default: 'https://ddnet.under1111.com/uclient'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      BUILD_PREFIX: ddnet
      CLIENT_NAME: UClient
      TARGET_REPOSITORY: ${{ github.repository }}
      R2_BUCKET: ${{ github.event.inputs.r2_bucket }}
      R2_PUBLIC_BASE_URL: ${{ github.event.inputs.r2_public_base_url }}
      CF_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BUILD_PREFIX }}-*
          merge-multiple: true
          path: ./artifacts/raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.body }}
          draft: false
          prerelease: false

      - name: Prepare Windows artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.zip" | head -n 1)
          if [ -z "$file" ]; then
            echo "No windows artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-windows.zip"

      - name: Prepare macOS artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.dmg" | head -n 1)
          if [ -z "$file" ]; then
            echo "No macOS artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-macos.dmg"

      - name: Prepare Ubuntu artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.tar.xz" | head -n 1)
          if [ -z "$file" ]; then
            echo "No Ubuntu artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"

      - name: Derive release metadata
        id: release_meta
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          WIN_FILE="${CLIENT_NAME}-windows.zip"
          MAC_FILE="${CLIENT_NAME}-macos.dmg"
          LIN_FILE="${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"

          WIN_PATH="uclient/${VERSION}/windows/${WIN_FILE}"
          MAC_PATH="uclient/${VERSION}/macos/${MAC_FILE}"
          LIN_PATH="uclient/${VERSION}/linux/${LIN_FILE}"

          WIN_SHA=$(sha256sum "./artifacts/${WIN_FILE}" | awk '{print $1}')
          MAC_SHA=$(sha256sum "./artifacts/${MAC_FILE}" | awk '{print $1}')
          LIN_SHA=$(sha256sum "./artifacts/${LIN_FILE}" | awk '{print $1}')

          WIN_SIZE=$(stat -c%s "./artifacts/${WIN_FILE}")
          MAC_SIZE=$(stat -c%s "./artifacts/${MAC_FILE}")
          LIN_SIZE=$(stat -c%s "./artifacts/${LIN_FILE}")

          mkdir -p ./artifacts/update-meta

          cat > ./artifacts/update-meta/latest.json <<JSON
          {
            "version": "${VERSION}",
            "releasedAt": "${RELEASED_AT}",
            "platforms": {
              "windows": {
                "name": "${WIN_FILE}",
                "path": "${WIN_PATH}",
                "url": "${R2_PUBLIC_BASE_URL}/${VERSION}/windows/${WIN_FILE}",
                "sha256": "${WIN_SHA}",
                "size": ${WIN_SIZE}
              },
              "macos": {
                "name": "${MAC_FILE}",
                "path": "${MAC_PATH}",
                "url": "${R2_PUBLIC_BASE_URL}/${VERSION}/macos/${MAC_FILE}",
                "sha256": "${MAC_SHA}",
                "size": ${MAC_SIZE}
              },
              "linux": {
                "name": "${LIN_FILE}",
                "path": "${LIN_PATH}",
                "url": "${R2_PUBLIC_BASE_URL}/${VERSION}/linux/${LIN_FILE}",
                "sha256": "${LIN_SHA}",
                "size": ${LIN_SIZE}
              }
            }
          }
          JSON

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "released_at=${RELEASED_AT}" >> "$GITHUB_OUTPUT"
          echo "win_path=${WIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "mac_path=${MAC_PATH}" >> "$GITHUB_OUTPUT"
          echo "lin_path=${LIN_PATH}" >> "$GITHUB_OUTPUT"

      - name: List artifacts directory
        run: |
          echo "Listing ./artifacts directory:"
          ls -R ./artifacts

      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-windows.zip
          asset_name: ${{ env.CLIENT_NAME }}-windows.zip
          asset_content_type: application/zip

      - name: Upload macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-macos.dmg
          asset_name: ${{ env.CLIENT_NAME }}-macos.dmg
          asset_content_type: application/octet-stream

      - name: Upload Ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-ubuntu-linux_x86_64.tar.xz
          asset_name: ${{ env.CLIENT_NAME }}-ubuntu-linux_x86_64.tar.xz
          asset_content_type: application/x-xz

      - name: Install rclone
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Upload OS artifacts to versioned Cloudflare R2 paths
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: |
          rclone copyto "./artifacts/${CLIENT_NAME}-windows.zip" \
            ":s3:${R2_BUCKET}/${{ steps.release_meta.outputs.win_path }}" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

          rclone copyto "./artifacts/${CLIENT_NAME}-macos.dmg" \
            ":s3:${R2_BUCKET}/${{ steps.release_meta.outputs.mac_path }}" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

          rclone copyto "./artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz" \
            ":s3:${R2_BUCKET}/${{ steps.release_meta.outputs.lin_path }}" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

      - name: Publish latest/versions update metadata to Cloudflare R2
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: |
          set -e

          EXISTING="[]"
          if rclone cat ":s3:${R2_BUCKET}/uclient/versions.json" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY} > /tmp/versions_existing.json 2>/dev/null; then
            if [ -s /tmp/versions_existing.json ] && jq -e 'type == "array"' /tmp/versions_existing.json >/dev/null 2>&1; then
              EXISTING=$(jq -c . /tmp/versions_existing.json)
            else
              echo "Existing uclient/versions.json missing or invalid; starting from empty list"
            fi
          fi

          jq --arg ver "${{ steps.release_meta.outputs.version }}" --arg released_at "${{ steps.release_meta.outputs.released_at }}" -n \
            --argjson existing "$EXISTING" \
            '([{"version": $ver, "releasedAt": $released_at}] + ($existing | map(select(.version != $ver))))' \
            > ./artifacts/update-meta/versions.json

          rclone copyto ./artifacts/update-meta/latest.json \
            ":s3:${R2_BUCKET}/uclient/latest.json" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

          rclone copyto ./artifacts/update-meta/latest.json \
            ":s3:${R2_BUCKET}/uclient/${{ steps.release_meta.outputs.version }}/latest.json" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

          rclone copyto ./artifacts/update-meta/versions.json \
            ":s3:${R2_BUCKET}/uclient/versions.json" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

      - name: Skip R2 publish (missing secrets)
        if: env.CF_R2_ACCOUNT_ID == '' || env.CF_R2_ACCESS_KEY_ID == '' || env.CF_R2_SECRET_ACCESS_KEY == ''
        run: echo "CF_R2_* secrets are not configured. Skipping R2 publish."

# .github/workflows/release.yml
name: Full UClient Distribution Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Fast Build workflow run ID (same commit). Leave empty to build in this workflow.'
        required: false
        type: string
        default: ''
      client_version:
        description: 'Client version (UCLIENT_VERSION in version.h)'
        required: true
        type: string
      launcher_version:
        description: 'Launcher version (UCLIENT_LAUNCHER_VERSION in version.h)'
        required: true
        type: string
      publish_full:
        description: 'Publish full distribution (download + legacy platforms)'
        required: false
        type: boolean
        default: true
      publish_client:
        description: 'Publish client update channel (zip without UClient.exe)'
        required: false
        type: boolean
        default: true
      publish_launcher:
        description: 'Publish launcher update channel (small launcher zip)'
        required: false
        type: boolean
        default: true
      create_github_release:
        description: 'Create GitHub Release and tag'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Optional Git tag override (must not exist)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Optional GitHub release title'
        required: false
        type: string
        default: ''
      body:
        description: 'Release description'
        required: false
        type: string
      r2_bucket:
        description: 'Cloudflare R2 bucket name'
        required: false
        default: 'download'
      r2_public_base_url:
        description: 'Public base URL for R2 release artifacts (without trailing slash)'
        required: false
        default: 'https://ddnet.under1111.com/uclient'

permissions:
  contents: write
  actions: read

env:
  CLIENT_NAME: UClient
  BUILD_PREFIX: ddnet

jobs:
  validate:
    name: Validate release versions
    runs-on: ubuntu-latest
    outputs:
      client_version: ${{ steps.versions.outputs.client_version }}
      launcher_version: ${{ steps.versions.outputs.launcher_version }}
      min_launcher_version: ${{ steps.versions.outputs.min_launcher_version }}
      publish_full: ${{ steps.flags.outputs.publish_full }}
      publish_client: ${{ steps.flags.outputs.publish_client }}
      publish_launcher: ${{ steps.flags.outputs.publish_launcher }}
      create_github_release: ${{ steps.flags.outputs.create_github_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version.h
        id: header
        shell: bash
        run: |
          set -euo pipefail
          client="$(
            awk '/^#define UCLIENT_VERSION "/ { gsub(/"/, "", $3); print $3; exit }' src/game/version.h
          )"
          launcher="$(
            awk '/^#define UCLIENT_LAUNCHER_VERSION "/ { gsub(/"/, "", $3); print $3; exit }' src/game/version.h
          )"
          test -n "$client" && test -n "$launcher"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "launcher=$launcher" >> "$GITHUB_OUTPUT"

      - name: Resolve requested versions
        id: versions
        shell: bash
        env:
          HEADER_CLIENT: ${{ steps.header.outputs.client }}
          HEADER_LAUNCHER: ${{ steps.header.outputs.launcher }}
          INPUT_CLIENT: ${{ github.event.inputs.client_version }}
          INPUT_LAUNCHER: ${{ github.event.inputs.launcher_version }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "${{ github.event_name }}" == "release" ]]; then
            requested="${{ github.event.release.tag_name }}"
            requested="${requested#v}"
            requested="${requested#V}"
            client="$requested"
            launcher="$HEADER_LAUNCHER"
          else
            client="${INPUT_CLIENT#v}"
            client="${client#client-v}"
            launcher="${INPUT_LAUNCHER#v}"
            launcher="${launcher#launcher-v}"
          fi
          [[ "$client" =~ $semver ]] || { echo "::error::Invalid client version '$client'"; exit 1; }
          [[ "$launcher" =~ $semver ]] || { echo "::error::Invalid launcher version '$launcher'"; exit 1; }
          [[ "$client" == "$HEADER_CLIENT" ]] || {
            echo "::error::Client version '$client' != UCLIENT_VERSION '$HEADER_CLIENT'"
            exit 1
          }
          [[ "$launcher" == "$HEADER_LAUNCHER" ]] || {
            echo "::error::Launcher version '$launcher' != UCLIENT_LAUNCHER_VERSION '$HEADER_LAUNCHER'"
            exit 1
          }
          echo "client_version=$client" >> "$GITHUB_OUTPUT"
          echo "launcher_version=$launcher" >> "$GITHUB_OUTPUT"
          echo "min_launcher_version=$launcher" >> "$GITHUB_OUTPUT"

      - name: Resolve publish flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "publish_full=true" >> "$GITHUB_OUTPUT"
            echo "publish_client=true" >> "$GITHUB_OUTPUT"
            echo "publish_launcher=true" >> "$GITHUB_OUTPUT"
            echo "create_github_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish_full=${{ github.event.inputs.publish_full }}" >> "$GITHUB_OUTPUT"
          echo "publish_client=${{ github.event.inputs.publish_client }}" >> "$GITHUB_OUTPUT"
          echo "publish_launcher=${{ github.event.inputs.publish_launcher }}" >> "$GITHUB_OUTPUT"
          echo "create_github_release=${{ github.event.inputs.create_github_release }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.publish_full }}" != "true" \
             && "${{ github.event.inputs.publish_client }}" != "true" \
             && "${{ github.event.inputs.publish_launcher }}" != "true" ]]; then
            echo "::error::At least one of publish_full, publish_client, publish_launcher must be true"
            exit 1
          fi

  build-cmake:
    name: Build Release (${{ matrix.name }})
    needs: validate
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_id == '')
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-24.04
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DDISCORD_DYNAMIC=ON -DVULKAN=ON
          cmake-init-env: CXXFLAGS="-Werror -Wno-unused-function"
          package-file: "*-linux_x86_64.tar.xz"
          artifact-name: release-linux
          asset-name: UClient-ubuntu-linux_x86_64.tar.xz
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DVULKAN=ON
          cmake-init-env: CXXFLAGS= LDFLAGS=
          package-file: "*-win64.zip"
          artifact-name: release-windows
          asset-name: UClient-windows.zip

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config ninja-build libcurl4-openssl-dev libfreetype6-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libsdl2-dev libsqlite3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libpng-dev libvulkan-dev libglew-dev -y

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Package release build
      run: |
        cmake -S . -B build-release ${{ matrix.cmake-args }}
        cmake --build build-release --config Release --target package_default
        mkdir artifacts
        mv build-release/${{ matrix.package-file }} artifacts/${{ matrix.asset-name }}

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: artifacts/${{ matrix.asset-name }}

  build-android:
    name: Build Release (android)
    needs: validate
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_id == '')
    runs-on: ubuntu-24.04
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install ninja-build openjdk-21-jdk openssl
        curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
        mkdir -p /home/runner/cmake
        tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
        rustup default 1.92.0
        cargo install cargo-ndk
        rustup target add armv7-linux-androideabi i686-linux-android aarch64-linux-android x86_64-linux-android
        scripts/android/download_android_sdk.sh /home/runner

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Prepare Android signing key
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      run: |
        TW_KEY_NAME=/home/runner/DDNet.jks
        if [ -n "$RELEASE_KEYSTORE_BASE64" ] && { [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; }; then
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$TW_KEY_NAME"
          TW_KEY_ALIAS="$RELEASE_KEY_ALIAS"
          TW_KEY_PW="$RELEASE_KEYSTORE_PASSWORD"
        else
          TW_KEY_ALIAS=DDNet-Key
          TW_KEY_PW="$(openssl rand -base64 32)"
          keytool -genkey -v -keystore "$TW_KEY_NAME" -keyalg RSA -keysize 2048 -validity 10000 -alias "$TW_KEY_ALIAS" -storepass "$TW_KEY_PW" -dname "CN=DDNet CI, OU=DDNet, O=DDNet"
        fi
        {
          echo "TW_KEY_NAME=$TW_KEY_NAME"
          echo "TW_KEY_ALIAS=$TW_KEY_ALIAS"
          echo "TW_KEY_PW=$TW_KEY_PW"
          echo "TW_VERSION_CODE=$(date -u +%Y%m%d%H)"
        } >> "$GITHUB_ENV"

    - name: Build Android app
      run: |
        export ANDROID_HOME="/home/runner/Android/Sdk"
        unset ANDROID_SDK_ROOT
        export PATH=/home/runner/cmake/bin:$PATH
        scripts/android/cmake_android.sh all DDNet org.ddnet.client Release build-android
        mkdir artifacts
        mv build-android/DDNet.apk artifacts/${{ env.CLIENT_NAME }}-android.apk

    - name: Upload Android package
      uses: actions/upload-artifact@v4
      with:
        name: release-android
        path: artifacts/${{ env.CLIENT_NAME }}-android.apk

  publish:
    name: Publish Release Assets
    needs:
      - validate
      - build-cmake
      - build-android
    if: |
      always() && !cancelled() && needs.validate.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_id != '') ||
        (needs.build-cmake.result == 'success' && needs.build-android.result == 'success')
      )
    runs-on: ubuntu-latest

    env:
      CLIENT_VERSION: ${{ needs.validate.outputs.client_version }}
      LAUNCHER_VERSION: ${{ needs.validate.outputs.launcher_version }}
      MIN_LAUNCHER_VERSION: ${{ needs.validate.outputs.min_launcher_version }}
      PUBLISH_FULL: ${{ needs.validate.outputs.publish_full }}
      PUBLISH_CLIENT: ${{ needs.validate.outputs.publish_client }}
      PUBLISH_LAUNCHER: ${{ needs.validate.outputs.publish_launcher }}
      CREATE_GITHUB_RELEASE: ${{ needs.validate.outputs.create_github_release }}
      R2_BUCKET: ${{ github.event.inputs.r2_bucket || 'download' }}
      R2_PUBLIC_BASE_URL: ${{ github.event.inputs.r2_public_base_url || 'https://ddnet.under1111.com/uclient' }}
      CF_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download packages from Fast Build run
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_id != ''
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ env.BUILD_PREFIX }}-*
        merge-multiple: true
        path: ./artifacts/raw
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        run-id: ${{ github.event.inputs.run_id }}

    - name: Normalize Fast Build artifacts
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_id != ''
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./artifacts
        win=$(find ./artifacts/raw -type f -name "*.zip" | head -n 1 || true)
        lin=$(find ./artifacts/raw -type f -name "*.tar.xz" | head -n 1 || true)
        mac=$(find ./artifacts/raw -type f -name "*.dmg" | head -n 1 || true)
        apk=$(find ./artifacts/raw -type f -name "*.apk" | head -n 1 || true)
        manifest=$(find ./artifacts/raw -type f -name "uclient_build_manifest.json" | head -n 1 || true)
        test -n "$win" || { echo "No windows zip in Fast Build run"; exit 1; }
        test -n "$lin" || { echo "No linux tar.xz in Fast Build run"; exit 1; }
        cp "$win" "./artifacts/${CLIENT_NAME}-windows-full.zip"
        cp "$win" "./artifacts/${CLIENT_NAME}-windows.zip"
        cp "$lin" "./artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"
        test -n "$manifest" || { echo "Missing uclient_build_manifest.json in Fast Build artifacts"; exit 1; }
        cp "$manifest" "./artifacts/${CLIENT_NAME}-windows.zip.manifest.json"
        if [ -n "$mac" ]; then cp "$mac" "./artifacts/${CLIENT_NAME}-macos.dmg"; fi
        if [ -n "$apk" ]; then cp "$apk" "./artifacts/${CLIENT_NAME}-android.apk"; fi

    - name: Download packages built in this workflow
      if: github.event_name == 'release' || github.event.inputs.run_id == ''
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: Ensure full Windows zip for local builds
      if: github.event_name == 'release' || github.event.inputs.run_id == ''
      shell: bash
      run: |
        set -euo pipefail
        test -s "artifacts/${CLIENT_NAME}-windows.zip"
        cp "artifacts/${CLIENT_NAME}-windows.zip" "artifacts/${CLIENT_NAME}-windows-full.zip"

    - name: Ensure client build manifest exists
      shell: bash
      run: |
        set -euo pipefail
        manifest="artifacts/${CLIENT_NAME}-windows.zip.manifest.json"
        if [[ -f "$manifest" ]]; then
          exit 0
        fi
        python3 - "$manifest" <<'PY'
        import json, os, pathlib, sys
        path = pathlib.Path(sys.argv[1])
        payload = {
            "component": "client",
            "clientVersion": os.environ["CLIENT_VERSION"],
            "launcherVersion": os.environ["LAUNCHER_VERSION"],
            "platform": "windows",
            "architecture": "x86_64",
            "gitSha": os.environ["GITHUB_SHA"],
        }
        path.write_text(json.dumps(payload, separators=(",", ":")) + "\n", encoding="utf-8")
        PY

    - name: Verify full Windows distribution contents
      if: env.PUBLISH_FULL == 'true'
      shell: bash
      run: |
        python3 - <<'PY'
        import pathlib, zipfile
        package = pathlib.Path("artifacts/UClient-windows-full.zip")
        with zipfile.ZipFile(package) as archive:
            names = {
                pathlib.PurePosixPath(n.replace("\\", "/")).name.lower()
                for n in archive.namelist() if not n.endswith("/")
            }
        missing = sorted({"ddnet.exe", "uclient.exe"} - names)
        if missing:
            raise SystemExit(f"Full Windows distribution incomplete; missing: {missing}")
        PY

    - name: Prepare Windows client and launcher packages
      if: env.PUBLISH_CLIENT == 'true' || env.PUBLISH_LAUNCHER == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/prepare_distribution_packages.py \
          --full "artifacts/${CLIENT_NAME}-windows-full.zip" \
          --client-manifest "artifacts/${CLIENT_NAME}-windows.zip.manifest.json" \
          --client-version "$CLIENT_VERSION" \
          --launcher-version "$LAUNCHER_VERSION" \
          --git-sha "$GITHUB_SHA" \
          --client-out "artifacts/${CLIENT_NAME}-windows-client.zip" \
          --launcher-out "artifacts/${CLIENT_NAME}-launcher-windows.zip"
        if [[ "$PUBLISH_CLIENT" == "true" ]]; then
          cp "artifacts/${CLIENT_NAME}-windows-client.zip" "artifacts/${CLIENT_NAME}-windows.zip"
          python3 scripts/verify_uclient_release.py package \
            --component client --version "$CLIENT_VERSION" --git-sha "$GITHUB_SHA" \
            --archive "artifacts/${CLIENT_NAME}-windows.zip"
        fi
        if [[ "$PUBLISH_LAUNCHER" == "true" ]]; then
          python3 scripts/verify_uclient_release.py package \
            --component launcher --version "$LAUNCHER_VERSION" --git-sha "$GITHUB_SHA" \
            --archive "artifacts/${CLIENT_NAME}-launcher-windows.zip"
        fi

    - name: Inject client manifest into Linux archive
      if: env.PUBLISH_CLIENT == 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive="artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"
        test -f "$archive"
        manifest="artifacts/${CLIENT_NAME}-windows.zip.manifest.json"
        test -f "$manifest"
        stage="$RUNNER_TEMP/client-linux"
        rm -rf "$stage" && mkdir -p "$stage"
        tar -xJf "$archive" -C "$stage"
        mapfile -d '' top < <(find "$stage" -mindepth 1 -maxdepth 1 -print0)
        content="$stage"
        if [[ "${#top[@]}" -eq 1 && -d "${top[0]}" ]]; then content="${top[0]}"; fi
        python3 - "$manifest" "$content/uclient_build_manifest.json" <<'PY'
        import json, pathlib, sys
        src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
        data = json.loads(src.read_text(encoding="utf-8-sig"))
        data["component"] = "client"
        data["clientVersion"] = __import__("os").environ["CLIENT_VERSION"]
        data["gitSha"] = __import__("os").environ["GITHUB_SHA"]
        dst.write_text(json.dumps(data, separators=(",", ":")) + "\n", encoding="utf-8")
        PY
        tar -cJf "$archive" -C "$stage" .

    - name: Derive full distribution metadata
      if: env.PUBLISH_FULL == 'true'
      id: full_meta
      shell: bash
      run: |
        set -euo pipefail
        RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        WIN_FILE="${CLIENT_NAME}-windows.zip"
        LIN_FILE="${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"
        MAC_FILE="${CLIENT_NAME}-macos.dmg"
        WIN_PATH="uclient/${CLIENT_VERSION}/windows/${WIN_FILE}"
        LIN_PATH="uclient/${CLIENT_VERSION}/linux/${LIN_FILE}"
        mkdir -p ./artifacts/update-meta
        WIN_SHA=$(sha256sum "./artifacts/${CLIENT_NAME}-windows-full.zip" | awk '{print $1}')
        LIN_SHA=$(sha256sum "./artifacts/${LIN_FILE}" | awk '{print $1}')
        WIN_SIZE=$(stat -c%s "./artifacts/${CLIENT_NAME}-windows-full.zip")
        LIN_SIZE=$(stat -c%s "./artifacts/${LIN_FILE}")
        BASE="${R2_PUBLIC_BASE_URL%/}"
        if [ -f "./artifacts/${MAC_FILE}" ]; then
          MAC_SHA=$(sha256sum "./artifacts/${MAC_FILE}" | awk '{print $1}')
          MAC_SIZE=$(stat -c%s "./artifacts/${MAC_FILE}")
          jq -n \
            --arg version "$CLIENT_VERSION" \
            --arg launcherVersion "$LAUNCHER_VERSION" \
            --arg releasedAt "$RELEASED_AT" \
            --arg winFile "$WIN_FILE" --arg winPath "$WIN_PATH" \
            --arg winUrl "${BASE}/${CLIENT_VERSION}/windows/${WIN_FILE}" \
            --arg winSha "$WIN_SHA" --argjson winSize "$WIN_SIZE" \
            --arg linFile "$LIN_FILE" --arg linPath "$LIN_PATH" \
            --arg linUrl "${BASE}/${CLIENT_VERSION}/linux/${LIN_FILE}" \
            --arg linSha "$LIN_SHA" --argjson linSize "$LIN_SIZE" \
            --arg macFile "$MAC_FILE" \
            --arg macPath "uclient/${CLIENT_VERSION}/macos/${MAC_FILE}" \
            --arg macUrl "${BASE}/${CLIENT_VERSION}/macos/${MAC_FILE}" \
            --arg macSha "$MAC_SHA" --argjson macSize "$MAC_SIZE" \
            '{
              version: $version,
              launcherVersion: $launcherVersion,
              releasedAt: $releasedAt,
              platforms: {
                windows: { name: $winFile, path: $winPath, url: $winUrl, sha256: $winSha, size: $winSize },
                linux: { name: $linFile, path: $linPath, url: $linUrl, sha256: $linSha, size: $linSize },
                macos: { name: $macFile, path: $macPath, url: $macUrl, sha256: $macSha, size: $macSize }
              }
            }' > ./artifacts/update-meta/full-latest.json
          echo "has_mac=1" >> "$GITHUB_OUTPUT"
        else
          jq -n \
            --arg version "$CLIENT_VERSION" \
            --arg launcherVersion "$LAUNCHER_VERSION" \
            --arg releasedAt "$RELEASED_AT" \
            --arg winFile "$WIN_FILE" --arg winPath "$WIN_PATH" \
            --arg winUrl "${BASE}/${CLIENT_VERSION}/windows/${WIN_FILE}" \
            --arg winSha "$WIN_SHA" --argjson winSize "$WIN_SIZE" \
            --arg linFile "$LIN_FILE" --arg linPath "$LIN_PATH" \
            --arg linUrl "${BASE}/${CLIENT_VERSION}/linux/${LIN_FILE}" \
            --arg linSha "$LIN_SHA" --argjson linSize "$LIN_SIZE" \
            '{
              version: $version,
              launcherVersion: $launcherVersion,
              releasedAt: $releasedAt,
              platforms: {
                windows: { name: $winFile, path: $winPath, url: $winUrl, sha256: $winSha, size: $winSize },
                linux: { name: $linFile, path: $linPath, url: $linUrl, sha256: $linSha, size: $linSize }
              }
            }' > ./artifacts/update-meta/full-latest.json
          echo "has_mac=0" >> "$GITHUB_OUTPUT"
        fi
        echo "released_at=$RELEASED_AT" >> "$GITHUB_OUTPUT"
        echo "win_path=$WIN_PATH" >> "$GITHUB_OUTPUT"
        echo "lin_path=$LIN_PATH" >> "$GITHUB_OUTPUT"

    - name: Prepare client channel metadata
      if: env.PUBLISH_CLIENT == 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="${R2_PUBLIC_BASE_URL%/}"
        released_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        jq -n \
          --arg version "$CLIENT_VERSION" \
          --arg minLauncherVersion "$MIN_LAUNCHER_VERSION" \
          --arg releasedAt "$released_at" \
          --arg base "$base" \
          --arg win_sha "$(sha256sum artifacts/UClient-windows.zip | cut -d' ' -f1)" \
          --argjson win_size "$(stat -c%s artifacts/UClient-windows.zip)" \
          --arg lin_sha "$(sha256sum artifacts/UClient-ubuntu-linux_x86_64.tar.xz | cut -d' ' -f1)" \
          --argjson lin_size "$(stat -c%s artifacts/UClient-ubuntu-linux_x86_64.tar.xz)" \
          '{
            component: "client",
            version: $version,
            minLauncherVersion: $minLauncherVersion,
            releasedAt: $releasedAt,
            platforms: {
              windows: {
                name: "UClient-windows.zip",
                path: ("uclient/client/" + $version + "/windows/UClient-windows.zip"),
                url: ($base + "/client/" + $version + "/windows/UClient-windows.zip"),
                sha256: $win_sha, size: $win_size
              },
              linux: {
                name: "UClient-ubuntu-linux_x86_64.tar.xz",
                path: ("uclient/client/" + $version + "/linux/UClient-ubuntu-linux_x86_64.tar.xz"),
                url: ($base + "/client/" + $version + "/linux/UClient-ubuntu-linux_x86_64.tar.xz"),
                sha256: $lin_sha, size: $lin_size
              }
            }
          }' > artifacts/update-meta/client-latest.json
        if [ -f artifacts/UClient-macos.dmg ]; then
          jq \
            --arg mac_sha "$(sha256sum artifacts/UClient-macos.dmg | cut -d' ' -f1)" \
            --argjson mac_size "$(stat -c%s artifacts/UClient-macos.dmg)" \
            --arg version "$CLIENT_VERSION" \
            --arg base "$base" \
            '.platforms.macos = {
              name: "UClient-macos.dmg",
              path: ("uclient/client/" + $version + "/macos/UClient-macos.dmg"),
              url: ($base + "/client/" + $version + "/macos/UClient-macos.dmg"),
              sha256: $mac_sha, size: $mac_size
            }' artifacts/update-meta/client-latest.json > artifacts/update-meta/client-latest.json.tmp
          mv artifacts/update-meta/client-latest.json.tmp artifacts/update-meta/client-latest.json
        fi
        if [ -f artifacts/UClient-android.apk ]; then
          jq \
            --arg apk_sha "$(sha256sum artifacts/UClient-android.apk | cut -d' ' -f1)" \
            --argjson apk_size "$(stat -c%s artifacts/UClient-android.apk)" \
            --arg version "$CLIENT_VERSION" \
            --arg base "$base" \
            '.platforms.android = {
              name: "UClient-android.apk",
              path: ("uclient/client/" + $version + "/android/UClient-android.apk"),
              url: ($base + "/client/" + $version + "/android/UClient-android.apk"),
              sha256: $apk_sha, size: $apk_size
            }' artifacts/update-meta/client-latest.json > artifacts/update-meta/client-latest.json.tmp
          mv artifacts/update-meta/client-latest.json.tmp artifacts/update-meta/client-latest.json
        fi
        echo "CLIENT_RELEASED_AT=$released_at" >> "$GITHUB_ENV"

    - name: Prepare launcher channel metadata
      if: env.PUBLISH_LAUNCHER == 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="${R2_PUBLIC_BASE_URL%/}"
        released_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        jq -n \
          --arg version "$LAUNCHER_VERSION" \
          --arg releasedAt "$released_at" \
          --arg base "$base" \
          --arg sha "$(sha256sum artifacts/UClient-launcher-windows.zip | cut -d' ' -f1)" \
          --argjson size "$(stat -c%s artifacts/UClient-launcher-windows.zip)" \
          '{
            component: "launcher",
            version: $version,
            releasedAt: $releasedAt,
            platforms: {
              windows: {
                name: "UClient-launcher-windows.zip",
                path: ("uclient/launcher/" + $version + "/windows/UClient-launcher-windows.zip"),
                url: ($base + "/launcher/" + $version + "/windows/UClient-launcher-windows.zip"),
                sha256: $sha,
                size: $size
              }
            }
          }' > artifacts/update-meta/launcher-latest.json
        echo "LAUNCHER_RELEASED_AT=$released_at" >> "$GITHUB_ENV"

    - name: Set release timestamp
      id: release_time
      shell: bash
      run: echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Merge legacy distribution latest.json
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/r2-existing
        RELEASED_AT="${{ steps.release_time.outputs.released_at }}"
        EXISTING_LATEST=/tmp/r2-existing/latest.json
        EXISTING_VERSIONS=/tmp/r2-existing/versions.json
        if [[ -n "${CF_R2_ACCOUNT_ID:-}" ]]; then
          rclone cat ":s3:${R2_BUCKET}/uclient/latest.json" \
            --s3-provider Cloudflare \
            --s3-endpoint "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --s3-access-key-id "${CF_R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key "${CF_R2_SECRET_ACCESS_KEY}" \
            > "$EXISTING_LATEST" 2>/dev/null || true
          rclone cat ":s3:${R2_BUCKET}/uclient/versions.json" \
            --s3-provider Cloudflare \
            --s3-endpoint "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --s3-access-key-id "${CF_R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key "${CF_R2_SECRET_ACCESS_KEY}" \
            > "$EXISTING_VERSIONS" 2>/dev/null || true
        fi
        ARGS=(
          --client-version "$CLIENT_VERSION"
          --launcher-version "$LAUNCHER_VERSION"
          --released-at "$RELEASED_AT"
          --out-latest artifacts/update-meta/legacy-latest.json
          --out-versions artifacts/update-meta/legacy-versions.json
        )
        [[ -s "$EXISTING_LATEST" ]] && ARGS+=(--existing-latest "$EXISTING_LATEST")
        [[ -s "$EXISTING_VERSIONS" ]] && ARGS+=(--existing-versions "$EXISTING_VERSIONS")
        if [[ "$PUBLISH_FULL" == "true" ]]; then
          ARGS+=(--publish-full --full-latest artifacts/update-meta/full-latest.json)
        fi
        python3 scripts/merge_distribution_latest.py "${ARGS[@]}"

    - name: Resolve Git tag and release title
      id: release_tag
      if: env.CREATE_GITHUB_RELEASE == 'true' && github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        set -euo pipefail
        override='${{ github.event.inputs.tag_name }}'
        if [[ -n "$override" ]]; then
          tag="$override"
        elif [[ "$PUBLISH_FULL" == "true" || ( "$PUBLISH_CLIENT" == "true" && "$PUBLISH_LAUNCHER" == "true" ) ]]; then
          tag="dist-${CLIENT_VERSION}-${LAUNCHER_VERSION}"
        elif [[ "$PUBLISH_CLIENT" == "true" ]]; then
          tag="client-v${CLIENT_VERSION}"
        elif [[ "$PUBLISH_LAUNCHER" == "true" ]]; then
          tag="launcher-v${LAUNCHER_VERSION}"
        else
          tag="dist-${CLIENT_VERSION}-${LAUNCHER_VERSION}"
        fi
        if git rev-parse "$tag" >/dev/null 2>&1; then
          echo "::error::Git tag '$tag' already exists"
          exit 1
        fi
        title='${{ github.event.inputs.release_name }}'
        if [[ -z "$title" ]]; then
          title="Client ${CLIENT_VERSION} / Launcher ${LAUNCHER_VERSION}"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "title=$title" >> "$GITHUB_OUTPUT"

    - name: Collect GitHub Release assets
      if: github.event_name == 'workflow_dispatch' && env.CREATE_GITHUB_RELEASE == 'true'
      id: release_assets
      shell: bash
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/release-assets.txt"
        : > "$list"
        if [[ "$PUBLISH_FULL" == "true" ]]; then
          echo "artifacts/${CLIENT_NAME}-windows-full.zip" >> "$list"
        fi
        if [[ "$PUBLISH_CLIENT" == "true" ]]; then
          echo "artifacts/${CLIENT_NAME}-windows.zip" >> "$list"
          echo "artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz" >> "$list"
          test ! -f "artifacts/${CLIENT_NAME}-macos.dmg" || echo "artifacts/${CLIENT_NAME}-macos.dmg" >> "$list"
          test ! -f "artifacts/${CLIENT_NAME}-android.apk" || echo "artifacts/${CLIENT_NAME}-android.apk" >> "$list"
        fi
        if [[ "$PUBLISH_LAUNCHER" == "true" ]]; then
          echo "artifacts/${CLIENT_NAME}-launcher-windows.zip" >> "$list"
        fi
        {
          echo "files<<EOF"
          cat "$list"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && env.CREATE_GITHUB_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        name: ${{ steps.release_tag.outputs.title }}
        body: ${{ github.event.inputs.body }}
        files: ${{ steps.release_assets.outputs.files }}

    - name: Attach assets to published GitHub release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: artifacts/${{ env.CLIENT_NAME }}-*

    - name: Install rclone
      if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends rclone jq

    - name: Upload artifacts and metadata to R2
      if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
      shell: bash
      run: |
        set -euo pipefail
        r2=(--s3-provider Cloudflare
            --s3-endpoint "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            --s3-access-key-id "$CF_R2_ACCESS_KEY_ID"
            --s3-secret-access-key "$CF_R2_SECRET_ACCESS_KEY")
        copy() { rclone copyto "$1" ":s3:${R2_BUCKET}/$2" "${r2[@]}"; }

        if [[ "$PUBLISH_FULL" == "true" ]]; then
          copy "artifacts/${CLIENT_NAME}-windows-full.zip" "${{ steps.full_meta.outputs.win_path }}"
          copy "artifacts/${CLIENT_NAME}-windows-full.zip" "uclient/win64/UClient-windows.zip"
          copy "artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz" "${{ steps.full_meta.outputs.lin_path }}"
          if [[ "${{ steps.full_meta.outputs.has_mac }}" == "1" ]]; then
            copy "artifacts/${CLIENT_NAME}-macos.dmg" "uclient/${CLIENT_VERSION}/macos/${CLIENT_NAME}-macos.dmg"
          fi
        fi

        if [[ "$PUBLISH_CLIENT" == "true" ]]; then
          copy "artifacts/${CLIENT_NAME}-windows.zip" "uclient/client/${CLIENT_VERSION}/windows/${CLIENT_NAME}-windows.zip"
          copy "artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz" "uclient/client/${CLIENT_VERSION}/linux/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"
          if [[ -f "artifacts/${CLIENT_NAME}-macos.dmg" ]]; then
            copy "artifacts/${CLIENT_NAME}-macos.dmg" "uclient/client/${CLIENT_VERSION}/macos/${CLIENT_NAME}-macos.dmg"
          fi
          if [[ -f "artifacts/${CLIENT_NAME}-android.apk" ]]; then
            copy "artifacts/${CLIENT_NAME}-android.apk" "uclient/client/${CLIENT_VERSION}/android/${CLIENT_NAME}-android.apk"
          fi
          copy artifacts/update-meta/client-latest.json "uclient/client/latest.json"
          copy artifacts/update-meta/client-latest.json "uclient/client/${CLIENT_VERSION}/latest.json"
          existing='[]'
          if rclone cat ":s3:${R2_BUCKET}/uclient/client/versions.json" "${r2[@]}" \
              > /tmp/client-versions.json 2>/dev/null &&
              jq -e 'type == "array"' /tmp/client-versions.json >/dev/null; then
            existing="$(jq -c . /tmp/client-versions.json)"
          fi
          jq -n \
            --arg version "$CLIENT_VERSION" \
            --arg releasedAt "${CLIENT_RELEASED_AT:-${{ steps.release_time.outputs.released_at }}}" \
            --argjson existing "$existing" \
            '([{ version: $version, releasedAt: $releasedAt }]
              + ($existing | map(select(.version != $version))))' \
            > artifacts/update-meta/client-versions.json
          copy artifacts/update-meta/client-versions.json "uclient/client/versions.json"
        fi

        if [[ "$PUBLISH_LAUNCHER" == "true" ]]; then
          copy "artifacts/${CLIENT_NAME}-launcher-windows.zip" \
            "uclient/launcher/${LAUNCHER_VERSION}/windows/UClient-launcher-windows.zip"
          copy artifacts/update-meta/launcher-latest.json "uclient/launcher/latest.json"
          copy artifacts/update-meta/launcher-latest.json "uclient/launcher/${LAUNCHER_VERSION}/latest.json"
          existing='[]'
          if rclone cat ":s3:${R2_BUCKET}/uclient/launcher/versions.json" "${r2[@]}" \
              > /tmp/launcher-versions.json 2>/dev/null &&
              jq -e 'type == "array"' /tmp/launcher-versions.json >/dev/null; then
            existing="$(jq -c . /tmp/launcher-versions.json)"
          fi
          jq -n \
            --arg version "$LAUNCHER_VERSION" \
            --arg releasedAt "${LAUNCHER_RELEASED_AT:-${{ steps.release_time.outputs.released_at }}}" \
            --argjson existing "$existing" \
            '([{ version: $version, releasedAt: $releasedAt }]
              + ($existing | map(select(.version != $version))))' \
            > artifacts/update-meta/launcher-versions.json
          copy artifacts/update-meta/launcher-versions.json "uclient/launcher/versions.json"
        fi

        copy artifacts/update-meta/legacy-latest.json "uclient/latest.json"
        copy artifacts/update-meta/legacy-latest.json "uclient/${CLIENT_VERSION}/latest.json"
        copy artifacts/update-meta/legacy-versions.json "uclient/versions.json"

    - name: Skip R2 publish (missing secrets)
      if: env.CF_R2_ACCOUNT_ID == '' || env.CF_R2_ACCESS_KEY_ID == '' || env.CF_R2_SECRET_ACCESS_KEY == ''
      run: echo "CF_R2_* secrets are not configured. Skipping R2 publish."

# .github/workflows/release.yml
name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.0.0). Did you remember to bump the version.h?'
        required: true
      release_name:
        description: 'Name of the release'
        required: true
      body:
        description: 'Release description'
        required: false
      run_id:
        description: 'Run ID of the build workflow to download artifacts from'
        required: true
      r2_bucket:
        description: 'Cloudflare R2 bucket name'
        required: false
        default: 'download'
      r2_prefix:
        description: 'Cloudflare R2 object prefix for Windows files'
        required: false
        default: 'download'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      BUILD_PREFIX: ddnet
      CLIENT_NAME: UClient
      TARGET_REPOSITORY: ${{ github.repository }}
      R2_BUCKET: ${{ github.event.inputs.r2_bucket }}
      R2_PREFIX: ${{ github.event.inputs.r2_prefix }}
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BUILD_PREFIX }}-*
          merge-multiple: true
          path: ./artifacts/raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.body }}
          draft: false
          prerelease: false

      - name: Prepare Windows artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.zip" | head -n 1)
          if [ -z "$file" ]; then
            echo "No windows artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-windows.zip"

      - name: Prepare macOS artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.dmg" | head -n 1)
          if [ -z "$file" ]; then
            echo "No macOS artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-macos.dmg"

      - name: Prepare Ubuntu artifact
        run: |
          file=$(find ./artifacts/raw -type f -name "*.tar.xz" | head -n 1)
          if [ -z "$file" ]; then
            echo "No Ubuntu artifact found"
            exit 1
          fi
          mv "$file" "./artifacts/${CLIENT_NAME}-ubuntu-linux_x86_64.tar.xz"

      - name: Extract Windows package for R2 sync
        run: |
          mkdir -p ./artifacts/windows_extracted
          unzip -o "./artifacts/${CLIENT_NAME}-windows.zip" -d ./artifacts/windows_extracted

      - name: List artifacts directory
        run: |
          echo "Listing ./artifacts directory:"
          ls -R ./artifacts

      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-windows.zip
          asset_name: ${{ env.CLIENT_NAME }}-windows.zip
          asset_content_type: application/zip

      - name: Upload macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-macos.dmg
          asset_name: ${{ env.CLIENT_NAME }}-macos.dmg
          asset_content_type: application/octet-stream

      - name: Upload Ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-ubuntu-linux_x86_64.tar.xz
          asset_name: ${{ env.CLIENT_NAME }}-ubuntu-linux_x86_64.tar.xz
          asset_content_type: application/x-xz

      - name: Install rclone
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Sync Windows files to Cloudflare R2 (changed files only)
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: |
          rclone sync ./artifacts/windows_extracted \
            :s3:${R2_BUCKET}/${R2_PREFIX} \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY} \
            --checksum \
            --fast-list \
            --create-empty-src-dirs

      - name: Upload zip to Cloudflare R2 (download endpoint)
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: |
          rclone copyto "./artifacts/${CLIENT_NAME}-windows.zip" \
            ":s3:${R2_BUCKET}/uclient/win64/${CLIENT_NAME}-windows.zip" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY}

      - name: Verify zip exists in Cloudflare R2
        if: env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != ''
        run: |
          set -e
          rclone lsf ":s3:${R2_BUCKET}/uclient/win64" \
            --s3-provider Cloudflare \
            --s3-endpoint https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com \
            --s3-access-key-id ${CF_R2_ACCESS_KEY_ID} \
            --s3-secret-access-key ${CF_R2_SECRET_ACCESS_KEY} > /tmp/r2_win64_list.txt

          echo "R2 win64 objects:"
          cat /tmp/r2_win64_list.txt

          grep -Fx "${CLIENT_NAME}-windows.zip" /tmp/r2_win64_list.txt >/dev/null || {
            echo "Expected file not found in R2: uclient/win64/${CLIENT_NAME}-windows.zip"
            exit 1
          }

      - name: Skip R2 sync (missing secrets)
        if: env.CF_R2_ACCOUNT_ID == '' || env.CF_R2_ACCESS_KEY_ID == '' || env.CF_R2_SECRET_ACCESS_KEY == ''
        run: echo "CF_R2_* secrets are not configured. Skipping R2 sync."


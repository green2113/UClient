# .github/workflows/release.yml
name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag for the release (e.g., v1.0.0). Did you remember to bump the version.h?'
        required: true
      release_name:
        description: 'Name of the release'
        required: true
      body:
        description: 'Release description'
        required: false
      run_id:
        description: 'Run ID of the build workflow to download artifacts from'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BUILD_PREFIX: ddnet
      CLIENT_NAME: UClient
      TARGET_REPOSITORY: ${{ github.repository }} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_PREFIX }}-ubuntu-22.04
          path: ./artifacts/ubuntu
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_PREFIX }}-windows-latest
          path: ./artifacts/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_PREFIX }}-macOS-latest
          path: ./artifacts/macOS
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_PREFIX }}-android
          path: ./artifacts/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ env.TARGET_REPOSITORY }}
          run-id: ${{ github.event.inputs.run_id }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: ${{ github.event.inputs.release_name }}
          body: ${{ github.event.inputs.body }}
          draft: false
          prerelease: false

      - name: Rename and Move Artifacts
        run: |
          declare -a multi_ext=("tar.gz" "tar.bz2" "tar.xz" "tar.Z")

          for dir in ./artifacts/*/ ; do
            os=$(basename "$dir")
            # Find the single file in the OS directory
            file=$(find "$dir" -type f | head -n 1)

            if [ -z "$file" ]; then
              echo "No artifact found in directory $dir. Skipping."
              continue
            fi
            filename=$(basename "$file")
            extension=""
            for ext in "${multi_ext[@]}"; do
              if [[ "$filename" == *.$ext ]]; then
                extension="$ext"
                break
              fi
            done
            if [ -z "$extension" ]; then
              extension="${filename##*.}"
            fi
            new_name="${CLIENT_NAME}-${os}.${extension}"
            echo "Renaming $file to $new_name"
            mv "$file" "./artifacts/$new_name"
            echo "Moved $new_name to ./artifacts/"
          done

      - name: List artifacts directory
        run: |
          echo "Listing ./artifacts directory:"
          ls -R ./artifacts

      - name: Prepare standalone binaries for R2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full python3-pip jq
          python3 -m pip install --user awscli

          mkdir -p r2/tmp/windows r2/tmp/linux r2/tmp/macos r2upload

          echo "Extracting Windows executable"
          unzip -q "./artifacts/${CLIENT_NAME}-windows.zip" -d r2/tmp/windows
          WIN_BIN=$(find r2/tmp/windows -type f -name 'DDNet*.exe' | head -n 1 || true)
          if [ -z "$WIN_BIN" ]; then
            echo "Unable to find DDNet executable in Windows artifact"
            exit 1
          fi
          cp "$WIN_BIN" "r2upload/DDNet-win64.exe"

          echo "Extracting Linux executable"
          tar -xJf "./artifacts/${CLIENT_NAME}-ubuntu.tar.xz" -C r2/tmp/linux
          LIN_BIN=$(find r2/tmp/linux -type f -executable -name 'DDNet*' ! -name '*.so' | head -n 1 || true)
          if [ -z "$LIN_BIN" ]; then
            echo "Unable to find DDNet executable in Linux artifact"
            exit 1
          fi
          cp "$LIN_BIN" "r2upload/DDNet-linux-x86_64.exe"

          echo "Copying macOS disk image"
          cp "./artifacts/${CLIENT_NAME}-macOS.dmg" "r2upload/DDNet-macOS.dmg"

          echo "Preparing Android package"
          cp "./artifacts/${CLIENT_NAME}-android.apk" "r2upload/DDNet-android.apk"

          echo "Fetching latest data file list"
          curl -fsSL https://ddnet.under1111.com/update/update.json -o r2/tmp/update.json
          jq -r 'max_by(.version | split(".") | map(tonumber)) | .download[]? | select(startswith("data/"))' r2/tmp/update.json > r2upload/data-files.txt
          echo "Data files to upload:"
          cat r2upload/data-files.txt

      - name: Upload artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLIENT_NAME: ${{ env.CLIENT_NAME }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "Clearing existing download objects in bucket ${R2_BUCKET}"
          aws s3 rm "s3://${R2_BUCKET}/download" --recursive --endpoint-url "$ENDPOINT" || true
          echo "Uploading extracted binaries to R2 bucket ${R2_BUCKET}"
          aws s3 cp "r2upload/DDNet-win64.exe" "s3://${R2_BUCKET}/download/DDNet-win64.exe" --endpoint-url "$ENDPOINT"
          aws s3 cp "r2upload/DDNet-linux-x86_64.exe" "s3://${R2_BUCKET}/download/DDNet-linux-x86_64.exe" --endpoint-url "$ENDPOINT"
          aws s3 cp "r2upload/DDNet-macOS.dmg" "s3://${R2_BUCKET}/download/DDNet-macOS.dmg" --endpoint-url "$ENDPOINT"
          aws s3 cp "r2upload/DDNet-android.apk" "s3://${R2_BUCKET}/download/DDNet-android.apk" --endpoint-url "$ENDPOINT"
          if [ -s "r2upload/data-files.txt" ]; then
            echo "Uploading selected data files"
            while IFS= read -r data_file; do
              [ -z "$data_file" ] && continue
              if [ -f "$data_file" ]; then
                content_type="application/octet-stream"
                case "$data_file" in
                  *.txt|*.cfg|*.csv|*.ini) content_type="text/plain; charset=utf-8" ;;
                  *.json) content_type="application/json; charset=utf-8" ;;
                esac
                aws s3 cp "$data_file" "s3://${R2_BUCKET}/download/${data_file}" --endpoint-url "$ENDPOINT" --content-type "$content_type"
              else
                echo "Warning: data file '$data_file' not found in repository"
              fi
            done < "r2upload/data-files.txt"
          else
            echo "No data files listed in update.json"
          fi

      - name: Upload Ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-ubuntu.tar.xz
          asset_name: ${{ env.CLIENT_NAME }}-ubuntu.tar.xz
          asset_content_type: application/tar.xz
          

      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-windows.zip
          asset_name: ${{ env.CLIENT_NAME }}-windows.zip
          asset_content_type: application/zip

      - name: Upload macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-macOS.dmg
          asset_name: ${{ env.CLIENT_NAME }}-macOS.dmg
          asset_content_type: application/dmg

      - name: Upload Android
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/${{ env.CLIENT_NAME }}-android.apk
          asset_name: ${{ env.CLIENT_NAME }}-android.apk
          asset_content_type: application/apk
